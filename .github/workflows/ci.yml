name: CI

# Docs-only changes don't affect the build, so skip CI for them to
# save Actions minutes. Keep this list in sync with non-code paths.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".agents/**"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".agents/**"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"

# Least-privilege default; jobs get only what they explicitly need.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Deterministic install straight from the lockfile; fails if
      # package.json and package-lock.json disagree.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Fail on moderate+ vulnerabilities in shipped (production) dependencies,
      # so they get triaged in a PR instead of silently shipping. Dev/build tools
      # (--omit=dev) never reach users and only process our own trusted content,
      # so an advisory there does not gate CI (e.g. toml via remark-mdx-frontmatter,
      # which parses our YAML frontmatter at build time only).
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=moderate
